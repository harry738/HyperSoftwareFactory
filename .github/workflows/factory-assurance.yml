name: Factory assurance tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  assurance:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Test onboarding
        run: python scripts/test_factory_onboard.py
      - name: Test deterministic assurance boundaries
        run: python -m unittest discover -s factory -p test_assurance.py -v
