# Software Factory — project registry (example)
# This file is tracked in a public repo, so it holds placeholders only.
# Real projects, private repo names and local paths go in config/projects.local.yaml, which is not tracked.

projects:
  project-a:
    name: "Project A"
    repo: "<owner>/project-a"
    roadmap: "docs/product/roadmap.yaml"
    inbox: "docs/product/roadmap-inbox/"
    council_enabled: true
    sprint_cadence: weekly
    alert_channel: "telegram:[YOUR_TELEGRAM_CHAT_ID]"
    onboarded: "2026-01-01"
